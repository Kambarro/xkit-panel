<!DOCTYPE html>
<html lang="{{.Locale}}" data-theme="{{.Theme}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XKIT Panel — новый пароль</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={darkMode:['selector','[data-theme="dark"]'],theme:{extend:{colors:{base:{900:'#0a0e1a',800:'#11162a',700:'#21262d',600:'#1e2745'},acc:{DEFAULT:'#00E5FF',dim:'#0aa8cc'}}}}}
</script>
<style>
:root{--bg:#0a0e1a;--card:#11162a;--border:#1e2745;--text:#e6edf3;--muted:#8b949e;--acc:#00E5FF}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--muted:#656d76;--acc:#0969da}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px}
.inp{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px}
.inp:focus{outline:none;border-color:var(--acc)}
.muted{color:var(--muted)}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div class="fixed top-3 right-3 flex gap-2">
  <button onclick="toggleTheme()" class="px-3 py-1.5 rounded-lg card text-sm">🌓</button>
  <button onclick="toggleLang()" class="px-3 py-1.5 rounded-lg card text-sm" id="lang-btn">🌐 {{.Locale}}</button>
</div>
<div class="card p-8 w-full max-w-sm">
  <div class="flex items-center gap-2 mb-6 justify-center">
    <svg viewBox="0 0 100 100" width="44" height="44"><rect x="28" y="56" width="20" height="11" rx="3" fill="#B026FF"/><rect x="52" y="56" width="20" height="11" rx="3" fill="#B026FF"/><rect x="22" y="70" width="16" height="11" rx="3" fill="#B026FF"/><rect x="42" y="70" width="20" height="11" rx="3" fill="#B026FF"/><rect x="66" y="70" width="12" height="11" rx="3" fill="#B026FF"/><polyline points="8,70 22,40 50,26 74,38" fill="none" stroke="#00E5FF" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="70" r="5.5" fill="#00E5FF"/><polygon points="93,62 76.5,49.5 84,40" fill="#00E5FF"/></svg>
    <span class="font-semibold text-xl">XKIT <span style="color:var(--acc)">Panel</span></span>
  </div>
  <div class="text-center mb-4"><span class="text-3xl">🔐</span></div>
  <h1 class="text-lg font-semibold mb-1 text-center" data-i18n="sp_title">Задайте новый пароль</h1>
  <p class="muted text-sm mb-6 text-center" data-i18n="sp_sub">Ваш пароль был одноразовым. Придумайте постоянный — без него панель не откроется.</p>
  <div id="err" class="hidden mb-4 p-3 rounded-lg text-sm" style="background:rgba(248,81,73,.12);color:#f85149"></div>
  <form onsubmit="return savePass(event)" class="space-y-4">
    <input type="hidden" name="username" autocomplete="username" value="{{.AdminLogin}}">
    <div>
      <label class="block text-sm mb-1.5" data-i18n="sp_new">Новый пароль</label>
      <div class="relative">
        <input id="p1" type="password" autocomplete="new-password" required minlength="8" class="inp w-full px-3 py-2.5 pr-10 text-sm" placeholder="минимум 8 символов" oninput="checkMatch()">
        <button type="button" onclick="togglePass('p1',this)" class="absolute right-2 top-1/2 -translate-y-1/2 muted text-lg" aria-label="Показать пароль">👁</button>
      </div>
    </div>
    <div>
      <label class="block text-sm mb-1.5" data-i18n="sp_repeat">Повторите пароль</label>
      <div class="relative">
        <input id="p2" type="password" autocomplete="new-password" required minlength="8" class="inp w-full px-3 py-2.5 pr-10 text-sm" placeholder="••••••••" oninput="checkMatch()">
        <button type="button" onclick="togglePass('p2',this)" class="absolute right-2 top-1/2 -translate-y-1/2 muted text-lg" aria-label="Показать пароль">👁</button>
      </div>
      <p id="match" class="muted text-xs mt-1"></p>
    </div>
    <button type="submit" class="w-full py-2.5 rounded-lg bg-acc-dim text-white text-sm font-medium hover:bg-acc" data-i18n="sp_save">Сохранить и войти</button>
  </form>
  <p class="muted text-xs mt-6 text-center" data-i18n="sp_hint">Забыли пароль позже? На сервере по SSH: xkit-panel reset-password — выдаст новый одноразовый.</p>
</div>
<script>
const BASE='{{.Base}}';
const I18N={en:{sp_title:'Set a new password',sp_sub:'Your password was one-time. Create a permanent one — the panel stays locked until you do.',sp_new:'New password',sp_repeat:'Repeat password',sp_save:'Save & enter',sp_hint:'Forgot it later? On the server via SSH: xkit-panel reset-password — gives a new one-time password.',err_len:'Minimum 8 characters',err_match:'Passwords do not match',err_srv:'Error: '}};
let locale='{{.Locale}}';const orig={};document.querySelectorAll('[data-i18n]').forEach(e=>orig[e.dataset.i18n]=e.textContent);
function t(k){return locale==='en'?(I18N.en[k]||orig[k]):orig[k];}
function toggleLang(){locale=locale==='ru'?'en':'ru';document.querySelectorAll('[data-i18n]').forEach(e=>{const k=e.dataset.i18n;e.textContent=t(k);});document.getElementById('lang-btn').textContent='🌐 '+locale;}
function toggleTheme(){const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';}
function showErr(msg){const e=document.getElementById('err');e.textContent=msg;e.classList.remove('hidden');}
function clearErr(){const e=document.getElementById('err');e.textContent='';e.classList.add('hidden');}
function togglePass(id,btn){const i=document.getElementById(id);i.type=i.type==='password'?'text':'password';btn.textContent=i.type==='password'?'👁':'🙈';}
function checkMatch(){
  const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value,m=document.getElementById('match');
  if(p1.length===0&&p2.length===0){m.textContent='';m.style.color='';return;}
  const ok=p1===p2;
  m.textContent=ok?(locale==='en'?'Passwords match':'Пароли совпадают'):(locale==='en'?'Passwords do not match':'Пароли не совпадают');
  m.style.color=ok?'#3fb950':'#f85149';
}
async function savePass(ev){
  ev.preventDefault();
  clearErr();
  const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;
  if(p1.length<8){showErr(t('err_len'));return false;}
  if(p1!==p2){showErr(t('err_match'));return false;}
  // смена пароля: current не нужен — мы уже вошли с одноразовым (сессия активна),
  // сервер проверяет must_change и текущую сессию
  const r=await fetch(BASE+'/api/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current:'',new:p1,first:true})});
  if(r.ok){window.location.href=BASE+'/';}
  else{showErr(t('err_srv')+(await r.text()));}
  return false;
}
</script>
</body>
</html>
